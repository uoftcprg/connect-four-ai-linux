[project]
name = "connect-four-ai-linux"
version = "1.0.0"
description = "A high performance implementation of a perfect Connect Four solver, written in Rust, ported to Linux."
readme = "README.md"
authors = [
    { name = "Universal, Open, Free, and Transparent Computer Poker Research Group", email = "juhok@cs.cmu.edu" }
]
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/uoftcprg/connect-four-ai-linux"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
